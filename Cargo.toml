[package]
name = "bread-manager"
version = "0.1.0"
edition = "2021"
description = "A small application to manage your finances with."

authors = ["Thomas Ellmenreich <thomas.ellmenreich@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.32.2"
egui = { version = "0.32.2", features = ["callstack", "document-features", "log"] }
egui_extras = { version = "0.32.2", features = ["chrono"] }
egui_plot = "0.33.0"

tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"
syntect = { optional = true, version = "5.2.0" }

dotenv = "0.15.0"
num-traits = "0.2.19"
uuid = { version = "1.18.1", features = ["v4", "v7", "serde", "fast-rng", "macro-diagnostics"] }
serde = { version = "1.0.219", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }

lazy_async_promise = { path = "../lazy_async_promise" } # "0.5.0"
egui_light_states = { path = "../egui_light_states" }
hermes = { path = "../hermes" }
sqlx_projector = { path = "../sqlx_projector" }
sea-query = { version = "0.32.7", features = ["with-uuid", "with-chrono", "with-json", "uuid", "serde_json", "chrono"] }
sea-orm = { version = "1.1.15", features = ["macros", "runtime-tokio", "sqlx-sqlite", "uuid", "with-uuid"] }
itertools = "0.14.0"
serde_json = "1.0.143"
console-subscriber = "0.4.1"
log = "0.4.28"
lazy_static = "1.5.0"

[features]
default = ["color-sql"]
color-sql = ["dep:syntect"]
